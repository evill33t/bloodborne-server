name: Windows directory durability probe
on:
  push:
    branches: [codex/validate-windows-durability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Check directory handle access on native Windows
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Native {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr CreateFileW(string path, uint access, uint share, IntPtr security, uint creation, uint flags, IntPtr template);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool FlushFileBuffers(IntPtr handle);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr handle);
          }
          '@
          $root = Join-Path $env:RUNNER_TEMP ('directory-flush-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path "$root/new-parent/mailbox" -Force | Out-Null
          foreach ($path in @("$root/new-parent/mailbox", "$root/new-parent", $root, (Split-Path $root))) {
            foreach ($access in @([uint32]2147483648, [uint32]1073741824, [uint32]3221225472)) {
              $h = [Native]::CreateFileW($path, $access, 7, [IntPtr]::Zero, 3, 33554432, [IntPtr]::Zero)
              $openError = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              $flushed = $false; $flushError = 0
              if ($h -ne [IntPtr](-1)) {
                $flushed = [Native]::FlushFileBuffers($h)
                $flushError = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
                [Native]::CloseHandle($h) | Out-Null
              }
              @{path=$path; access=$access; opened=($h -ne [IntPtr](-1)); openError=$openError; flushed=$flushed; flushError=$flushError} | ConvertTo-Json -Compress
            }
          }
          Remove-Item -Recurse -Force $root

      - uses: actions/checkout@v4
      - name: Check out server protobuf only
        run: git submodule update --init --depth 1 server/externals/protobuf
      - name: Install Qt 6.8.3
        run: |
          python -m pip install aqtinstall==3.2.1
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qthttpserver qtwebsockets -O C:/Qt
      - name: Build ten focused server suites with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=C:/Qt/6.8.3/msvc2022_64
          if errorlevel 1 exit /b 1
          cmake --build server/build --parallel 4 --target test_server_link test_build_fingerprint test_packet_routes test_rpc_tunnel test_admission test_http_gate test_team_lobby test_bloodborne_trade test_bloodborne_world test_world_writer
          if errorlevel 1 exit /b 1
      - name: Run ten focused server suites on native Windows
        shell: pwsh
        run: |
          $env:PATH = "C:/Qt/6.8.3/msvc2022_64/bin;" + $env:PATH
          ctest --test-dir server/build --output-on-failure -R '^(server_link|build_fingerprint|packet_routes|rpc_tunnel|admission|http_gate|team_lobby|bloodborne_trade|bloodborne_world|world_writer)$'
